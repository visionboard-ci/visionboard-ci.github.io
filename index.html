<style>
/* Atelier de nuit étoilée : étapes, studio (outils | tableau), aperçu en situation, finition. Look unique sombre et doré. */
:root{
  --night:#EFE5D8; --night2:#F7F0E6; --panel:rgba(255,253,249,.72); --panel2:rgba(120,84,64,.08); --line:rgba(150,110,80,.2);
  --ink:#2F2329; --muted:#7D6A70; --gold:#B98A45; --gold2:#B7772F; --amber:#F3B562; --rose:#F4B6C2; --peach:#F7C6A3; --plum:#1B1530;
  --f-display:'Cormorant Garamond','Lora',Georgia,serif; --f-body:'Poppins',system-ui,sans-serif; --f-script:'Great Vibes',cursive;
  color-scheme:light dark; --veil:251,246,239;
}
*{box-sizing:border-box}
html{min-height:100%;background:#F4ECE1}
body{min-height:100%;margin:0;background:radial-gradient(1100px 650px at 50% -12%,#FFF9F1 0%,#F8EFE4 40%,#F1E5D6 100%) fixed;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#E3B873;opacity:.35}
.garland{position:absolute;left:0;right:0;top:0;height:90px}
.bulb{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px 3px rgba(255,214,140,.75)}
@media (prefers-reduced-motion:no-preference){
  .star{animation:tw 3.5s ease-in-out infinite}
  .bulb{animation:tw 2.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:max(46px,env(safe-area-inset-top,0px))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand small{display:block;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(30px,4.6vw,48px);line-height:1.02;letter-spacing:.005em}
.brand h1 em{font-family:var(--f-script);font-style:normal;font-weight:400;color:#C98A3A;font-size:1.3em;text-shadow:0 0 14px rgba(243,181,98,.55),0 0 30px rgba(244,182,194,.6)}
.tagline{margin:6px 0 0;font-family:var(--f-display);font-style:italic;font-size:clamp(15px,2vw,19px);color:#B9786A;letter-spacing:.01em}
.neon{color:#FFF1DA;text-shadow:0 0 5px rgba(255,230,180,.85),0 0 14px rgba(243,181,98,.6),0 0 26px rgba(244,182,194,.45)}

.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff!important;color:#2F2329!important;border:1px solid #ddd!important}
.authOr{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:12px}.authOr:before,.authOr:after{content:"";flex:1;height:1px;background:var(--line)}
.authF{display:flex;flex-direction:column;gap:8px}.authF input{padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit}.authF .row{display:flex;gap:8px}.authF .row .btn{flex:1}

.authBox .err{color:#B0386A;font-size:13px}.authBox .ok{color:#2E7D4F;font-size:13px}

.steps{display:flex;align-items:stretch;gap:0;width:100%;border-bottom:1px solid var(--line)}

.steps button[data-s].done{color:var(--ink);border-bottom-color:rgba(185,138,69,.45)}.steps button[data-s].done b{color:var(--gold)}
.steps button[aria-current="step"]{color:var(--ink);font-weight:600;border-bottom-color:var(--gold2)}.steps button[aria-current="step"] b{color:var(--gold2);opacity:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:16px;min-width:0}

.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.formats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fmt{font:inherit;color:var(--ink);text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:12px;align-items:center}
.fmt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 16px rgba(242,196,107,.3)}
.fmt .ic{flex:none;width:48px;height:48px;display:grid;place-items:center}
.fmt .ic i{display:block;background:linear-gradient(160deg,#F6DCE5,#F2C46B);border-radius:3px;box-shadow:0 0 10px rgba(255,200,120,.4)}
.fmt strong{display:block;font-size:13px}.fmt span{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.btn{font:inherit;font-weight:600;border:0;background:linear-gradient(135deg,#FFE3A8,var(--amber) 45%,var(--peach) 75%,var(--rose));color:#1B1530;box-shadow:0 4px 18px rgba(243,181,98,.25);padding:11px 18px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.fmt:focus-visible,.tab:focus-visible,.thumb:focus-visible,.steps button:focus-visible,.model:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* mes tableaux */
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sv{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sv.cur{border-color:var(--gold)}
.sv .pv{height:150px;display:grid;place-items:center;--vh:150px}
.sv .pv .board{width:min(100%,calc(150px * var(--arn)));box-shadow:0 6px 16px rgba(0,0,0,.45)}
.sv strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv small{color:var(--muted);font-size:11px}
.sv .row{display:flex;gap:5px;flex-wrap:wrap}
/* studio */
.studio{display:grid;grid-template-columns:470px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.studio{grid-template-columns:minmax(0,1fr)}.tools{order:2}}
.tools{padding:14px;gap:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;max-height:430px;overflow:auto;padding:2px;touch-action:pan-y}
.thumb{position:relative;border:0;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:#3a2a36;cursor:grab;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.thumb.lift{transform:scale(.92);box-shadow:0 0 0 3px var(--gold)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb.on::after{content:"";position:absolute;inset:0;border:3px solid var(--gold);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 9px;border-radius:12px;cursor:pointer}

.models{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.model{font:inherit;color:var(--ink);border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.model[aria-pressed="true"]{border-color:var(--gold)}
.model .mwrap{height:86px;display:grid;place-items:center}

.model .mini i{position:absolute;border-radius:1px;box-shadow:0 0 0 .5px rgba(255,255,255,.9)}
.model strong{font-size:11px;line-height:1.2}
.phrases{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow:auto}
.prow{display:flex;gap:5px}.prow .phrase{flex:1}.pedit{font:inherit;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;padding:0 10px}
.phrase{font:inherit;font-size:13px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 10px;border-radius:9px;cursor:pointer}
.styles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.style{font:inherit;border:1.5px solid var(--line);background:#2F2329;border-radius:10px;padding:8px 6px;cursor:pointer;color:#fff;min-height:44px;display:grid;place-items:center;overflow:hidden}
.style[aria-pressed="true"]{border-color:var(--gold)}
input[type=text],input[type=tel],select{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:rgba(255,255,255,.85);color:var(--ink);width:100%}
select option{background:#FBF6F0;color:#2F2329}
.row{display:flex;gap:8px}
.stickers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wstk{display:flex;flex-wrap:wrap;gap:6px}

/* studio : panneau d'outils toujours visible à côté (ordinateur) ou en bas (téléphone) */
.tools{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:hidden}

.sheetT{display:none;margin-left:auto}

  html.dark .fpill{background:#3A2E3D;color:var(--ink)}
  html.dark .fpu{background:#3D2F46}
  html.dark .fo[aria-pressed="true"],html.dark .fs[aria-pressed="true"]{background:var(--ink);color:#1D171F;border-color:var(--ink)}
  html.dark .fo[aria-pressed="true"] small{color:rgba(29,23,31,.65)}
  html.dark .fsub{background:rgba(255,255,255,.04);border-left-color:var(--gold)}
  html.dark .fo.fu{background:linear-gradient(var(--surf2),var(--surf2)) padding-box,linear-gradient(115deg,#E9C46A,#F4B6C2,#B98A45,#F7C6A3,#E9C46A) border-box;background-size:100% 100%,300% 100%}
  html.dark .fo.fu[aria-pressed="true"]{background:linear-gradient(115deg,#5A3D4C,#7A5263) padding-box,linear-gradient(115deg,#E9C46A,#F4B6C2,#B98A45,#F7C6A3,#E9C46A) border-box;background-size:100% 100%,300% 100%;color:#fff}
  html.dark .tgl i{background:#4A3F4D}
  html.dark .btn.danger{color:#FF9C92;border-color:rgba(255,156,146,.45)}
  html.dark .btn.danger:hover{background:#3A2426}
  html.dark .btn.danger.sure{background:#C8362B;color:#fff;border-color:#C8362B}
  html.dark .gdanger{color:#FF9C92!important}
  html.dark .popH .savest.ok{color:#6FD39A}
  html.dark .savest.ok{color:#6FD39A}
  /* champs de saisie */
  html.dark input[type=text],html.dark input[type=tel],html.dark input[type=email],html.dark input[type=password],html.dark select,html.dark textarea,html.dark .ideaF textarea,html.dark .ideaF input[type=email],html.dark .ted textarea{background:#2A222D;color:var(--ink);border-color:var(--line)}
  html.dark input::placeholder,html.dark textarea::placeholder{color:#9C8B92}
  html.dark select option{background:#2A222D;color:var(--ink)}
  /* boutons clairs (outils) et segments */
  html.dark .btn.ghost{background:var(--panel);color:var(--ink)}
  html.dark .studio .btn:not(.ghost):not(.go):not(.danger):not(#brush):not(#panBtn){background:var(--panel);color:var(--ink)}
  html.dark .seg{background:rgba(255,255,255,.05)}
  html.dark .afold[aria-pressed="true"]{color:#2E1D25}
  /* guide (bulles du tutoriel) */
  html.dark #tourL .tbub{background:#2A2130;color:var(--ink)}
  html.dark #tourL .tbub p{color:#D6C6CC}
  html.dark #tourL .tchips i{background:#3A2E3D;color:var(--ink)}
  html.dark #tourL .tskip{color:#B8A6AD}
  html.dark #tourL .tprev{background:#3A2E3D;color:var(--ink)}
  /* écran final (Ton année est illuminée) */
  html.dark .final{background:radial-gradient(circle at 50% 40%,#2E2333,#151016 75%)}
  /* aperçus de ce qui sera posé sur le tableau (écritures, dessins) : sur fond papier clair, comme à l'impression */
  html.dark .stk{background:#F4ECE3;border-color:rgba(235,205,175,.35)}
  html.dark .stk:hover{border-color:var(--gold)}
  html.dark .fo.fu[aria-pressed="true"] small{color:rgba(255,255,255,.78)}
  html.dark .supic rect{stroke:var(--ink)}
  /* Google : bouton de marque, reste blanc */
  html.dark .gbtn{background:#fff!important;color:#2F2329!important}


/* pas de lueur autour des boutons clairs (outils) : coupée au bord des rangées qui défilent, elle faisait un rectangle éclairé */
.btn.ghost,.studio .btn:not(.go):not(#brush),.btn.danger{box-shadow:none}
/* boutons dorés dans une rangée qui défile : ombre courte, qui ne déborde pas */
.toolbar .btn.go,.selbar .btn,.acts .btn{box-shadow:0 2px 6px rgba(183,119,47,.18)}
/* voile des onglets d'étapes : bords gauche et droit fondus, sans arête */
.steps{border-radius:0;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);padding-left:14px;padding-right:14px}

/* ===== menu : réglages du site (⚙ en haut, discret) ===== */
.menuH{gap:8px}.menuH strong{flex:1}
.setG{padding:6px 9px;color:var(--muted)}.setG .ico{width:18px;height:18px}
.setRow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.setTx{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}.setTx strong{font-size:14px;overflow:hidden;text-overflow:ellipsis}.setTx small{color:var(--muted);font-size:12px}
.thSeg{margin:0}.thSeg .segb[aria-pressed="true"]{background:var(--panel);border-color:var(--gold)}
.setHint{font-size:11.5px;color:var(--muted);margin:-2px 2px 0}
.setFoot{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.setLink{background:none;border:0;font:inherit;font-size:13px;color:var(--muted);text-align:left;padding:8px 2px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.setLink:hover{color:var(--ink)}
/* page Aide & infos */
.hub{display:flex;flex-direction:column;gap:8px}
.hubI{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.hubI>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:10px}
.hubI>summary::-webkit-details-marker{display:none}
.hubI>summary::after{content:"›";margin-left:auto;color:var(--muted);transition:transform .2s}.hubI[open]>summary::after{transform:rotate(90deg)}
.hubB{padding:0 14px 14px}.hubB .info h3:first-child{margin-top:0}

/* ===== 26/11 (3) ===== */
/* compte : sous les étapes, seulement hors du studio */
#acct{align-self:flex-start;margin-top:-6px}
.studioOn #acct{display:none}
/* animations douces : menu qui glisse, éléments qui apparaissent l'un après l'autre, fermeture en fondu */
@media (prefers-reduced-motion:no-preference){
  .menuOv{animation:ovIn .28s ease both}.menuOv .menuP{animation:mIn .38s cubic-bezier(.22,1,.36,1) both}
  .menuOv .menuP>*{animation:mItem .42s cubic-bezier(.22,1,.36,1) both}
  .menuOv .menuP>*:nth-child(2){animation-delay:.04s}.menuOv .menuP>*:nth-child(3){animation-delay:.08s}.menuOv .menuP>*:nth-child(4){animation-delay:.12s}
  .menuOv .menuI{animation:mItem .42s cubic-bezier(.22,1,.36,1) both}
  .menuOv .menuI:nth-of-type(1){animation-delay:.06s}.menuOv .menuI:nth-of-type(2){animation-delay:.09s}.menuOv .menuI:nth-of-type(3){animation-delay:.12s}.menuOv .menuI:nth-of-type(4){animation-delay:.15s}.menuOv .menuI:nth-of-type(5){animation-delay:.18s}.menuOv .menuI:nth-of-type(6){animation-delay:.21s}
  .menuOv.closing{animation:ovOut .26s ease both}.menuOv.closing .menuP{animation:mOut .26s cubic-bezier(.4,0,.6,1) both}
  .popOv.closing{animation:ovOut .2s ease both}.popOv.closing .popC{animation:popOut .2s ease both}
  @keyframes ovIn{from{background:rgba(47,35,41,0)}}@keyframes ovOut{to{background:rgba(47,35,41,0)}}
  @keyframes mIn{from{transform:translateX(-104%)}}@keyframes mOut{to{transform:translateX(-104%)}}
  @keyframes mItem{from{opacity:0;transform:translateX(-14px)}}
  @keyframes popOut{to{opacity:0;transform:translateY(14px) scale(.985)}}
  .popOv.float .popC{animation:popFloat .3s cubic-bezier(.22,1.2,.36,1) both}
  @keyframes popFloat{from{opacity:0;transform:scale(.94) translateY(8px)}}
}
.menuOv.closing,.popOv.closing{pointer-events:none}
.menuP{overscroll-behavior:contain}
/* bouton flottant de l'accueil : centré sans transformation (plus stable), s'efface quand une fenêtre est ouverte */
.fab{left:0;right:0;margin:0 auto;width:max-content;transform:none;backface-visibility:hidden;transition:opacity .25s ease,translate .25s ease}
html.ovOpen .fab{opacity:0;translate:0 18px;pointer-events:none}
@media (max-width:900px){html.ovOpen,html.ovOpen body{overflow:hidden}}
/* mini page flottante (réglages du site) : petite carte centrée, aussi sur téléphone */
.popOv.float{align-items:center;padding:16px}
.popOv.float .popC{width:min(380px,100%);border-radius:22px;max-height:86vh;padding:16px 18px 18px;box-shadow:0 24px 60px rgba(30,15,20,.35)}
.popOv.float .popF{display:none}
.popOv.float .menuT{margin-top:8px}
/* langue : petite liste qui se déplie sous la flèche */
.langBtn{width:100%;font:inherit;color:inherit;cursor:pointer;text-align:left}
.chev{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);transition:transform .25s ease;flex:none}
.langW.open .chev{transform:rotate(180deg)}
.langList{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.22,1,.36,1)}
.langList>div{overflow:hidden;display:flex;flex-direction:column}
.langW.open .langList{grid-template-rows:1fr}
.langI{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;font-size:14px;color:var(--ink);padding:10px 12px;cursor:pointer;text-align:left}
.langI:last-child{border-bottom:0}.langI span{color:var(--gold2);font-weight:700}.langI small{color:var(--muted);font-size:11px}
.langI:disabled{color:var(--muted);cursor:default}
/* apparence : interrupteur « verre liquide » */
.lgSeg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:999px;background:linear-gradient(180deg,rgba(120,84,64,.10),rgba(120,84,64,.05));border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;box-shadow:inset 0 1px 3px rgba(60,35,20,.10)}
.lgSeg button{position:relative;z-index:3;background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:10px 4px;border-radius:999px;cursor:pointer;transition:color .25s}
.lgSeg button[aria-checked="true"],.lgSeg button.hov{color:var(--ink)}
.lgThumb{position:absolute;z-index:1;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:999px;pointer-events:none;
  transition:transform .5s cubic-bezier(.3,1.35,.45,1),scale .3s cubic-bezier(.3,1.35,.45,1);
  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.22) 55%,rgba(255,255,255,.38) 100%);
  -webkit-backdrop-filter:blur(2px) saturate(170%) brightness(1.06);backdrop-filter:blur(2px) saturate(170%) brightness(1.06);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -2px 4px rgba(120,84,64,.12),inset 0 0 0 .5px rgba(255,255,255,.4),0 6px 16px rgba(60,35,20,.18),0 1px 3px rgba(60,35,20,.12)}
.lgThumb::after{content:"";position:absolute;left:14%;right:14%;top:2px;height:38%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.lgSeg.drag .lgThumb{scale:1.12 1.22}
html.dark .lgSeg{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
html.dark .lgThumb{background:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.07) 55%,rgba(255,255,255,.14) 100%);border-color:rgba(255,255,255,.32);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.45)}
html.dark .lgThumb::after{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))}

/* ===== 26/11 (4) ===== */
/* accueil : les étapes remontent sous le titre (la place du compte est libre) */
body:not(.studioOn) #steps{margin-top:-14px}
/* verre liquide, version « Atelier » : verre crème et doré, discret, moins bombé */
.lgSeg{background:rgba(185,138,69,.07);box-shadow:none}
.lgThumb{background:linear-gradient(180deg,rgba(255,251,244,.94) 0%,rgba(251,239,220,.82) 100%);
  -webkit-backdrop-filter:blur(6px) saturate(140%);backdrop-filter:blur(6px) saturate(140%);
  border:1px solid rgba(185,138,69,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 8px rgba(183,119,47,.16);
  transition:transform .42s cubic-bezier(.25,1.15,.4,1),scale .25s ease}
.lgThumb::after{left:18%;right:18%;top:1px;height:1px;border-radius:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0))}
.lgSeg.drag .lgThumb{scale:1.04 1.08}
.lgSeg button[aria-checked="true"]{color:#8A5F22}
html.dark .lgSeg button[aria-checked="true"]{color:var(--gold2)}
html.dark .lgSeg{background:rgba(221,176,107,.07);box-shadow:none}
html.dark .lgThumb{background:linear-gradient(180deg,rgba(221,176,107,.26) 0%,rgba(221,176,107,.12) 100%);border-color:rgba(221,176,107,.5);
  box-shadow:inset 0 1px 0 rgba(255,236,200,.22),0 3px 10px rgba(0,0,0,.35)}
html.dark .lgThumb::after{background:linear-gradient(90deg,rgba(255,236,200,0),rgba(255,236,200,.5),rgba(255,236,200,0))}

/* bouton flottant de l'accueil : ancré sur la hauteur « barres du navigateur visibles » (100svh) → il ne bouge plus quand
   la barre du navigateur apparaît ou disparaît sous le doigt (il « esquivait » le toucher) */
@supports (height:100svh){.fab{bottom:auto;top:calc(100svh - 70px - env(safe-area-inset-bottom,0px))}}
.fab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fab:active{filter:brightness(.97)}
</style>

  const rec={kind:"board",draft:!S.keep,name:S.name||"Mon tableau",updatedAt:Date.now(),format:S.format,support:S.support,cadreCol:S.cadreCol,ml:S.ml,nb:S.nb,model:S.model,bg:S.bg,els,sparks:S.sparks,spg:S.spg,hair:S.hair,sexe:S.sexe,teint:S.teint,age:S.age};
  const key=JSON.stringify({...rec,updatedAt:0});if(key===lastSaved)return;
  saving=true;S.saveState="Enregistrement…";renderToolbar();
  const put=async()=>{for(const e of S.els){if(e.src&&e.src.startsWith("data:")){const p=pidOf(e.src);if(!SAVEDP.has(p)){await store.putPhoto(p,e.src);SAVEDP.add(p)}}}
    await store.save({id:S.boardId,...rec})};
  try{try{await put()}catch(e){if(DB)throw e;/* appareil plein : on fait de la place puis on réessaie */gcLocal();await pruneDrafts(0);SAVEDP.clear();await put()}
    lastSaved=key;if(!S.keep)pruneDrafts();S.saveState=S.keep?"Enregistré ✓":"Brouillon gardé ✓";
    const i=S.saved.findIndex(x=>x.id===S.boardId);const row={id:S.boardId,...rec};if(i>=0)S.saved[i]=row;else S.saved.unshift(row);
  }catch(err){S.saveState=DB?"Pas enregistré : réessaie dans un instant":"Pas enregistré sur cet appareil"}
  saving=false;renderToolbar()}
/* au plus MAXDRAFTS brouillons : les plus anciens partent d'eux-mêmes */
const MAXDRAFTS=12;
async function pruneDrafts(keepN=MAXDRAFTS-1){const old=S.saved.filter(b=>b.draft&&b.id!==S.boardId).sort((a,b)=>b.updatedAt-a.updatedAt).slice(keepN);
  for(const b of old){try{await store.del(b.id)}catch(e){}S.saved=S.saved.filter(x=>x.id!==b.id)}if(old.length)gcLocal()}
/* sur l'appareil (sans compte) : supprime les photos perso qui ne servent plus à aucun tableau */
function gcLocal(){if(DB)return;try{const used=new Set(["boards","orders","profile"]);
  (lsGet("boards")||[]).forEach(b=>(b.els||[]).forEach(e=>{if(e.src&&e.src.startsWith("u:"))used.add(e.src.slice(2))}));
  S.els.forEach(e=>{if(e.src&&e.src.startsWith("data:"))used.add(pidOf(e.src))});
  for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);const m=k&&k.match(/^atelier_(hd_)?(p[0-9a-z]+)$/);if(m&&!used.has(m[2])){localStorage.removeItem(k);SAVEDP.delete(m[2])}}}catch(e){}}
/* admin : publier le tableau ouvert comme modèle, directement depuis le studio */
async function tplFromStudio(btn){if(!ISADMIN||!S.boardId)return;if(btn){btn.disabled=true;btn.textContent="⏳…"}
  S.keep=true;lastSaved="";for(let i=0;i<20&&saving;i++)await new Promise(r=>setTimeout(r,200));await doSave();
  if(!S.saved.some(x=>x.id===S.boardId)){if(btn){btn.disabled=false;btn.textContent="Erreur, réessaie"}return}
  const was=TPLIDS.has(S.boardId);await publishTpl(S.boardId,btn);S.notice=TPLIDS.has(S.boardId)?"Publié dans la page Modèles ✓":was?"Retiré des modèles.":"";renderSelbar()}
function keepBoard(){if(!S.boardId)S.boardId=newBoardId();S.keep=true;lastSaved="";renderToolbar();doSave()}

let TPL=null,TPLERR=false;const TPLIDS=new Set();
async function loadTpls(){if(!HOSTED){TPL=[];return}try{await fbLoad();const q=await FB.db.collection("templates").get();TPL=q.docs.map(d=>({...safeBoard(d.data()),id:d.id})).sort((a,b)=>(b.publishedAt||0)-(a.publishedAt||0));TPLIDS.clear();TPL.forEach(t=>TPLIDS.add(t.id));TPLERR=false}catch(e){console.error("tpl",e);TPLERR=true;if(!TPL)TPL=[]}}
async function importLegacy(btn){if(!ISADMIN)return;if(btn){btn.disabled=true;btn.textContent="⏳ Récupération…"}
  for(const b of LEGACY){if(S.saved.some(x=>x.id===b.id))continue;const r={...JSON.parse(JSON.stringify(b)),kind:"board",updatedAt:Date.now()};try{await store.save(r);S.saved.unshift(r)}catch(e){console.error(e)}}
  render()}
async function publishTpl(id,btn){const b=S.saved.find(x=>x.id===id);if(!b||!ISADMIN)return;if(btn){btn.disabled=true;btn.textContent="⏳…"}
  try{if(TPLIDS.has(id)){await FB.db.collection("templates").doc(id).delete();TPLIDS.delete(id);if(TPL)TPL=TPL.filter(t=>t.id!==id)}
  else{const els=JSON.parse(JSON.stringify(b.els||[]));let small=0;
    for(const e of els){if(e.src&&e.src.startsWith("u:")){const pid=e.src.slice(2);let d=null;try{d=await store.getPhoto(pid)}catch(x){}
      if(HD[pid])e.src="h:"+HD[pid];else if(d&&small+d.length<600000){e.src=d;small+=d.length}else{e.type="slot";delete e.src}}}
    const t={...b,els,id,publishedAt:Date.now()};delete t.kind;await FB.db.collection("templates").doc(id).set(clean(t));TPLIDS.add(id);if(TPL)TPL=[t,...TPL.filter(x=>x.id!==id)]}
  }catch(e){console.error("pub",e);if(btn){btn.textContent="Erreur, réessaie";btn.disabled=false}return}render()}
async function toDataURL(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);const bl=await r.blob();return await new Promise((ok,ko)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=ko;f.readAsDataURL(bl)})}
async function useTpl(id,btn){const t=(TPL||[]).find(x=>x.id===id);if(!t)return;if(btn){btn.disabled=true;btn.textContent="⏳ Ouverture…"}
  const els=JSON.parse(JSON.stringify(t.els||[]));
  await Promise.all(els.map(async e=>{if(e.src&&e.src.startsWith("h:")){const hd=e.src.slice(2);try{const d=await toDataURL(hdThumb(hd,1400));HD[pidOf(d)]=hd;e.src=d}catch(x){e.type="slot";delete e.src}}}));
  await openBoard({...t,els,id:newBoardId(),name:t.name||"Mon tableau"});S.keep=false;S.saveState="";S.page=null;renderToolbar()}

async function openBoard(b){b={...safeBoard(b),id:b&&typeof b.id==="string"?b.id:newBoardId()};S.phc=((b.els||[]).find(e=>e.bk)||{}).bk||"";
  const els=JSON.parse(JSON.stringify(b.els||[]));

/* interrupteur « verre liquide » : la pastille suit le doigt, s'étire avec la vitesse, et le choix s'applique au relâché */
function bindGlassSeg(seg,keys,cur,onPick){const th=seg.querySelector(".lgThumb"),B=[...seg.querySelectorAll("[data-k]")],n=keys.length;let idx=Math.max(0,keys.indexOf(cur));const W=()=>(seg.clientWidth-8)/n;
  const place=(i,anim)=>{th.style.transition=anim?"":"none";th.style.transform=`translateX(${i*W()}px)`;B.forEach((b,j)=>b.setAttribute("aria-checked",j===i))};
  requestAnimationFrame(()=>place(idx,false));
  seg.addEventListener("pointerdown",e=>{if(e.button>0)return;e.preventDefault();const r=seg.getBoundingClientRect();const off=e.clientX-r.left-4-idx*W();const grab=off>=0&&off<=W();
    const pos=cx=>Math.max(0,Math.min((n-1)*W(),cx-r.left-4-(grab?off:W()/2)));let last=e.clientX,lt=performance.now();
    try{seg.setPointerCapture(e.pointerId)}catch(x){}seg.classList.add("drag");th.style.transition=grab?"none":"";th.style.transform=`translateX(${pos(e.clientX)}px)`;
    const mv=ev=>{const now=performance.now();const v=Math.abs(ev.clientX-last)/Math.max(1,now-lt);last=ev.clientX;lt=now;th.style.transition="none";th.style.transform=`translateX(${pos(ev.clientX)}px) scaleX(${(1+Math.min(.08,v*.06)).toFixed(3)})`;
      const k=Math.round(pos(ev.clientX)/W());B.forEach((b,j)=>b.classList.toggle("hov",j===k))};
    const up=ev=>{seg.removeEventListener("pointermove",mv);seg.removeEventListener("pointerup",up);seg.removeEventListener("pointercancel",up);seg.classList.remove("drag");B.forEach(b=>b.classList.remove("hov"));
      const k=Math.round(pos(ev.clientX)/W());const ch=k!==idx;idx=k;place(idx,true);if(ch||keys[idx]!==cur){cur=keys[idx];onPick(cur)}};
    seg.addEventListener("pointermove",mv);seg.addEventListener("pointerup",up);seg.addEventListener("pointercancel",up)});
  B.forEach((b,j)=>b.addEventListener("click",e=>{if(e.detail===0){idx=j;place(idx,true);cur=keys[j];onPick(cur)}}))}
